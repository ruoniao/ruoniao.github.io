<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="{{ page.description | default: site.description | escape }}"><title>{{ page.title | escape }} · {{ site.data.profile.name }}</title><link rel="stylesheet" href="{{ '/assets/css/personal.css' | relative_url }}"><link rel="stylesheet" href="{{ '/assets/css/rouge-syntax-github.css' | relative_url }}"><link rel="alternate" type="application/rss+xml" title="若鸟的记录" href="{{ '/feed.xml' | relative_url }}"><link rel="canonical" href="{{ page.url | absolute_url }}">{% if page.map %}<link rel="stylesheet" href="{{ '/assets/css/mountain.css' | relative_url }}">{% endif %}</head>
<body class="{% if page.map %}map-page{% endif %}"><a class="skip" href="#main">跳到内容</a><header class="site-header"><div class="header-inner"><a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a><nav aria-label="主导航">{% for item in site.navigation %}<a href="{{ item.url | relative_url }}" {% if page.nav == item.title or layout.nav == item.title %}aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}</nav></div></header><main id="main" class="{% unless page.map %}page-shell{% endunless %}">{{ content }}</main>{% unless page.map %}<footer class="site-footer"><span>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }} · 持续记录，保持好奇。</span><div><a href="{{ site.data.profile.github }}">GitHub</a><a href="mailto:{{ site.data.profile.email }}">联系我</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div></footer>{% endunless %}<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script></body></html>
